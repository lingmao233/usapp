# 「我们」一键部署：app（FastAPI + 前端静态） + redis（可选缓存）
# 用法：cp .env.example .env 并按需填写后，docker compose up -d
services:
  app:
    build: .
    image: us-app:latest
    container_name: us-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # compose 内部网络里 Redis 的服务名就是 redis，固定指向它；
      # 如需改用外部 Redis，把下面这行改成你的地址即可
      REDIS_URL: redis://redis:6379/0
      DB_PATH: /app/server/data/app.db
    volumes:
      - us-data:/app/server/data
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7
    container_name: us-redis
    restart: unless-stopped
    # 不暴露端口，仅在 compose 内部网络可达
    volumes:
      - us-redis-data:/data

volumes:
  us-data:
  us-redis-data:
