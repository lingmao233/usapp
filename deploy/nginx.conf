# 「我们」nginx 参考配置（可选增强层）
# 适用场景：不用 Docker 直接跑 uvicorn，或想自己管 HTTPS/域名。
# Docker 单容器部署时不需要本文件——容器内 FastAPI 已直接托管静态文件。
#
# 用法（Ubuntu + nginx）：
#   1. 本机跑后端：cd server && .venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000
#   2. 本机构建前端：npm run build（生成 dist/）
#   3. sudo cp deploy/nginx.conf /etc/nginx/sites-available/us-app
#      sudo ln -s /etc/nginx/sites-available/us-app /etc/nginx/sites-enabled/
#   4. 按实际路径改 root，sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;   # 改成你的域名或服务器 IP

    # 前端构建产物（按实际部署路径修改）
    root /opt/us-app/dist;
    index index.html;

    # gzip 压缩静态资源
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2;

    # 静态资源长缓存（vite 产物文件名带 hash，可放心长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反代到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # LLM 生成周报可能较慢
    }

    # 其余路径回退到 index.html（SPA 前端路由）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
